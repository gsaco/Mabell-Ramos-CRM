ecesita acordar su alcance.","branding":{"paper":"brand-122","pattern":"brand-108","ornament":"brand-116"}},{"id":"sabores","chapter":"Web","theme":"cream","layout":"collection","title":"Siete sabores.\nToda una colección.","copy":"Cuatro chocotejas y tres alfajores, tal como se presentan hoy en la web.","images":["live-web-chocotejas","live-web-alfajores"],"notes":"Las dos capturas muestran las secciones de chocotejas y alfajores. Ampliar cada pantalla para leer los sabores y sus descripciones.","branding":{"paper":"brand-120","pattern":"brand-109"}},{"id":"recorrido","chapter":"Web","theme":"lilac","layout":"webmobile","title":"Ver, elegir\ny consultar.","copy":"Al tocar «Consultar», se abre WhatsApp con el producto elegido y el contacto del negocio.","images":["live-web-alfajores","live-whatsapp-landing"],"notes":"El botón de cada producto dirige a WhatsApp al número 932 666 526 y prepara un mensaje con el sabor elegido. La captura muestra el destino real de la consulta de alfajores clásicos. El cliente decide si envía el mensaje; consultar no crea automáticamente un pedido en Mi día.","branding":{"paper":"brand-121","pattern":"brand-107"}},{"id":"catering","chapter":"Web","theme":"cream","layout":"catering","title":"Una reunión.\nUna propuesta a medida.","copy":"El formulario envía los datos del evento al correo del negocio para preparar la cotización.","images":["live-web-catering-form","live-web-catering-mobile-top"],"cta":"Abrir catering","link":"catering","notes":"La solicitud reúne nombre, WhatsApp, fecha, personas, distrito, alcance y comentario. Está configurada para enviar un correo a mabellramospe@gmail.com con un asunto que identifica el evento y los datos ordenados. No se envió una solicitud de prueba para esta presentación. La solicitud no confirma una reserva.","branding":{"paper":"brand-106","pattern":"brand-108"}},{"id":"web-vivo","chapter":"Web","theme":"plum","layout":"webdemo","title":"Reseñas con\norigen visible.","copy":"Cada reseña enlaza al comentario original en Instagram para que el cliente pueda consultarlo.","images":["live-web-contact","live-web-review-mobile"],"cta":"Ver comentario original","link":"instagramReview","notes":"La web muestra testimonios y ofrece un enlace al comentario original en Instagram. El botón abre el comentario que aparece en la captura. Esto permite consultar su procedencia; no es una sincronización automática de reseñas. Instagram puede pedir iniciar sesión.","branding":{"paper":"brand-122","pattern":"brand-105"}},{"id":"app","chapter":"App","theme":"lilac","layout":"appintro","title":"Mi día,\nen el celular.","copy":"Lo que una registra, la otra puede verlo. Ambas consultan la misma base de datos.","images":["live-app-hoy","live-app-pedidos"],"cta":"Abrir la app","link":"app","notes":"La app guarda los registros en una base de datos D1 de Cloudflare, fuera de los celulares. Así, ambas consultan el mismo negocio y los cambios guardados se reflejan en el otro equipo cuando se sincroniza con internet. Si los datos se guardaran solo en un celular, el otro no podría consultarlos. La clave del negocio no está incluida en la presentación.","branding":{"paper":"brand-121","pattern":"brand-107"}},{"id":"hoy","chapter":"App","theme":"cream","layout":"today","title":"Lo próximo,\na primera vista.","copy":"Entregas próximas, acciones rápidas y dinero de hoy y del mes.","images":["live-app-hoy","live-app-hoy-bottom"],"notes":"Mostrar la fecha, las entregas próximas y las acciones Nuevo pedido, Vendí algo y Anotar gasto. Las pantallas son ejemplos del uso de la app: no presentan sus importes como indicadores reales del negocio.","branding":{"paper":"brand-120","pattern":"brand-109"}},{"id":"pedidos","chapter":"App","theme":"cream","layout":"orders","title":"Del pedido\na la entrega.","copy":"Registrar primero. Consultar y actualizar cada pedido después.","images":["live-app-new-order","live-app-detail"],"notes":"Guardar pedido registra el pedido y su estado se cambia desde el detalle. Contacto y dirección son opcionales. Las capturas de detalle y edición usan datos ficticios, sin contacto personal. Se pueden registrar pagos y corregir errores.","branding":{"paper":"brand-124","pattern":"brand-108"},"galleries":[{"label":"Registrar","screens":[["Pedido","live-app-new-order"],["Entrega","live-app-order-contact"]]},{"label":"Dar seguimiento","screens":[["Detalle","live-app-detail"],["Editar","live-app-edit-order"],["Lista","live-app-pedidos"]]}]},{"id":"dinero","chapter":"App","theme":"plum","layout":"money","title":"El dinero,\nmás claro.","copy":"Lo recibido, lo gastado y lo que falta cobrar. Hoy y durante el mes.","images":["live-app-dinero","live-app-expense"],"notes":"Mostrar la vista mensual y el registro de gastos. Los cobros y gastos son movimientos de dinero; no afirmar que esta pantalla calcula la utilidad del negocio. Los costos por receta y el trabajo propio forman parte de otros pendientes del plan. Los importes son los que estaban visibles en la app al tomar la captura; no se presentan como resultados de la intervención.","branding":{"pattern":"brand-107"},"galleries":[{"label":"El panorama","screens":[["Resumen","live-app-dinero"],["Movimientos","live-app-movimientos"]]},{"label":"Los registros","screens":[["Gasto","live-app-expense"],["Excel","live-app-excel"]]}]},{"id":"autonomia","chapter":"App","theme":"lilac","layout":"autonomy","title":"Una app que\npueden adaptar.","copy":"Pueden crear y actualizar productos, cambiar precios y fotos, y ajustar los datos del negocio.","images":["live-app-alfajores","live-app-help"],"notes":"Mostrar Productos y luego Editar para explicar qué pueden cambiar por sí mismas: nombre, presentación, precio y foto. También pueden pausar productos y corregir datos del negocio desde Ayuda. Los cambios se guardan en la app compartida; no actualizan automáticamente la web ni el catálogo.","branding":{"paper":"brand-106","pattern":"brand-105"},"galleries":[{"label":"Su colección","screens":[["Productos","live-app-alfajores"],["Editar","live-app-edit-product"]]},{"label":"Su negocio","screens":[["Ayuda","live-app-help"],["Ajustes","live-app-business"],["Conexión","live-app-health"]]}]},{"id":"excel","chapter":"Excel","theme":"cream","layout":"excel","title":"Todo lo anotado,\nen Excel","copy":"Descargan el historial registrado en la app para revisarlo, filtrarlo o compartirlo.","label":"03 / Exportar los registros","images":["live-app-excel"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"En Dinero o Ayuda, tocar Exportar Excel y después Descargar Excel. El archivo reúne cinco hojas: Resumen, Pedidos, Detalle, Movimientos y Productos. Incluye los datos compartidos descargados hasta ese momento; volver a exportar incorpora nuevos registros. La pantalla del celular es una captura de la app. La tabla de esta diapositiva es una vista simplificada con datos ficticios de ejemplo, no una captura de Microsoft Excel ni cifras reales del negocio. Conserva los tipos de datos de la exportación. Los cambios hechos en Excel no regresan a la app; las fotos de productos no se incluyen en el archivo."},{"id":"control-puente","chapter":"Excel","theme":"plum","layout":"financebridge","title":"De las ventas\na los resultados.","copy":"Los registros de la app son el punto de partida. Al sumar los costos, podemos analizar precios, márgenes y metas de venta.","label":"03 / Del registro al control financiero","images":["live-app-excel"],"branding":{"pattern":"brand-107"},"notes":"Transición sugerida: «Ya vimos cómo descargar los registros. Ahora mi compañero mostrará cómo complementarlos con los costos para entender los resultados del negocio». El archivo Control_Mabell_Ramos.xlsm tiene cinco hojas y no dispone de una importación automática de la app. El traslado requiere revisar ventas confirmadas, hacer coincidir nombres de producto y completar canal, unidades producidas, costos y precios aplicables. Los cobros o adelantos no deben confundirse con unidades vendidas. La app exporta precios históricos por pedido; el formulario de este Excel usa el precio vigente, por lo que deben conciliarse descuentos y ventas históricas al trasladarlas. Los botones del archivo funcionan con macros en Excel de escritorio. Esta presentación describe el flujo propuesto y las funciones verificadas; no implementa una nueva integración."},{"id":"control-costos","chapter":"Excel","theme":"cream","layout":"financecosts","title":"Cada producto,\ncon sus costos claros.","copy":"Insumos, empaque y gastos del negocio: la base para revisar cuánto cuesta producir y a qué precio vender.","label":"03 / Costos y precios","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Recorrer las tres pestañas. Costos_Tanda suma los conceptos por producto y divide el total entre las unidades de la tanda, actualmente 60. Los dos productos y sus importes son ejemplos del archivo, no costos reales validados. El costo del alfajor suma S/ 56.50 y el de la chocoteja S/ 60.93. Costos_Fijos reúne gastos mensuales, cuyos importes todavía están vacíos; la vista agrupa algunos conceptos para facilitar la lectura. Precios toma el costo unitario, permite ingresar el precio de venta y calcula la diferencia, su porcentaje sobre el precio y un precio sugerido con margen objetivo. Usamos el término aporte por unidad porque todavía falta cubrir los costos fijos. Las cifras visibles se redondean, pero el cálculo usa la precisión completa del archivo. Las tablas son representaciones simplificadas, no capturas de Microsoft Excel. El catálogo de productos y conceptos se puede adaptar."},{"id":"control-resultados","chapter":"Excel","theme":"lilac","layout":"financeresults","title":"Cuánto vender.\nCómo va el negocio.","copy":"El control reúne las ventas por canal y calcula la meta mensual, su avance y el resultado después de costos.","label":"03 / Ventas y resultados financieros","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-105"},"notes":"Recorrer Ventas_Canales y Punto_Equilibrio. El archivo permite registrar fecha, canal (Catering, Feria o Pedido), producto, unidades producidas y vendidas. Calcula ingresos, costo producido y sobrantes; el resumen por canal es acumulado, no está filtrado por mes. Punto_Equilibrio calcula metas por producto y un promedio suponiendo que todos los productos se venden por igual. Permite añadir ganancia deseada, muestra una referencia semanal dividiendo entre 4.3 y selecciona el mes para medir el avance. El resultado mensual es ingresos menos costo de toda la producción del mes menos costos fijos, según la fórmula del archivo; no es un estado de resultados contable completo ni equivale al efectivo cobrado. Ejemplo ilustrativo: 120 alfajores producidos, 110 vendidos a S/ 2.50 por Catering; 60 chocotejas producidas y 50 vendidas a S/ 3 por Feria; otras 60 producidas y vendidas por Pedido. Todos los registros del ejemplo corresponden al mismo mes. Ingresos S/ 605; costo producido S/ 234.86; sobrantes 20 unidades. Con S/ 300 de costos fijos, ganancia objetivo cero y mezcla de ventas 50/50, la meta es 170 unidades o S/ 467.50. El avance es 129.4% y el resultado mensual S/ 70.14. Estos datos ilustran las fórmulas del archivo; no son cifras reales del negocio. Para usar sus botones, abrir el .xlsm en Excel de escritorio con las macros autorizadas."},{"id":"san-ruta","chapter":"Registro","theme":"lilac","layout":"sanroute","title":"Del producto\nal registro sanitario.","copy":"La ruta de trabajo para preparar la solicitud. Según el avance del equipo, estamos en el análisis de laboratorio.","steps":[["RUC y Clave SOL","Preparar el acceso a la VUCE."],["Ficha técnica","Composición, lote, envase y rotulado."],["Análisis en laboratorio","Cotizar y realizar los ensayos del producto."],["Solicitud en VUCE","Reunir el informe y la documentación."],["Costos y observaciones","Verificar la tasa vigente y responder observaciones."],["Registro y etiqueta","Incorporar el código y controlar su vigencia."]],"label":"04 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-105","paper":"brand-106"},"notes":"Fuente: Registro Sanitario - Expo.pptx, diapositiva 1. Contenido original: MABELL RAMOS · REGISTRO SANITARIO Del producto al registro sanitario. 01 Ten RUC y Clave SOL Para entrar a la VUCE. 02 Ficha técnica del producto Composición, lote, envase y rotulado. 03 ESTAMOS AQUÍ Análisis en laboratorio Laboratorio acreditado por INACAL. 04 Envía la solicitud En la VUCE, con análisis y rotulado. 05 Costos y observaciones Sin tasa DIGESA desde 2026; responde a tiempo. 06 Recibe tu registro Código para tu etiqueta; vigencia de 5 años. Plazo estimado: 1 a 3 meses, incluyendo laboratorio. PASO 3 DE 6\nAdaptación visual y resumen para exposición. Los requisitos, costos, plazos, acreditaciones y la vida útil deben verificarse antes del trámite. Las cifras de composición, envase y vida útil son ejemplos del material; no especificaciones validadas."},{"id":"san-acceso","chapter":"Registro","theme":"cream","layout":"sandetail","title":"Primero,\nel acceso al trámite.","copy":"Paso 1 · RUC y Clave SOL","actions":["Confirmar que el RUC de Ana esté activo como persona natural con negocio.","Actualizar correo y celular de la ficha RUC.","Generar o recuperar la Clave SOL.","Probar el ingreso a la VUCE y elegir DIGESA."],"note":"Este paso se cierra al comprobar que Ana puede ingresar a la VUCE.","documentLabel":"ACCESO AL TRÁMITE","documentTitle":"Ana Joya · Titular","fields":[["RUC","Persona natural con negocio. Según el material, Ana ya cuenta con él."],["Ficha RUC","Correo y celular actualizados para gestionar el acceso."],["Clave SOL","Generación o recuperación desde los canales de SUNAT."],["VUCE","Ingreso con RUC, usuario y Clave SOL. Entidad: DIGESA."]],"label":"04 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"notes":"Fuente: Registro Sanitario - Expo.pptx, diapositiva 2. Contenido original: PASO 1 DE 6 · QUÉ SE HACE Paso 1: RUC y Clave SOL. 1 Confirmar que el RUC de Ana esté activo y sea de persona natural con negocio. 2 Revisar que el correo y el celular de la ficha RUC estén actualizados. 3 Generar o recuperar la Clave SOL. 4 Entrar a la VUCE y elegir DIGESA para probar el acceso. Si Ana ya tiene su Clave SOL, este paso se cierra al probar el ingreso a la VUCE. Ana Joya, titular RUC Persona natural con negocio, empieza con 10. Ya lo tiene. Ficha RUC Correo y celular al día: ahí llega el código para la Clave SOL. Clave SOL Se genera con su RUC en la App Personas SUNAT o en sunat.gob.pe; si la olvidó, se recupera ahí mismo. VUCE vuce.gob.pe, entidad DIGESA, con RUC, usuario y Clave SOL. Mabell Ramos · Registro sanitario DIGESA PASO 1 DE 6\nAdaptación visual y resumen para exposición. Los requisitos, costos, plazos, acreditaciones y la vida útil deben verificarse antes del trámite. Las cifras de composición, envase y vida útil son ejemplos del material; no especificaciones validadas."},{"id":"san-ficha","chapter":"Registro","theme":"lilac","layout":"sandetail","title":"El producto,\nbien documentado.","copy":"Paso 2 · Ficha técnica y proyecto de rotulado","actions":["Detallar ingredientes y aditivos, con su código SIN cuando corresponda.","Definir lote, envase, presentación, conservación y vida útil.","Preparar la etiqueta con la información del producto.","Organizar la ficha y revisar el alcance del registro solicitado."],"note":"La receta, la vida útil y el envase del ejemplo deben confirmarse antes de presentar el expediente.","documentLabel":"EJEMPLO DEL MATERIAL · POR VALIDAR","documentTitle":"Chocoteja de lúcuma","fields":[["Ingredientes","Cobertura, manjar blanco, pasta de lúcuma, pecanas y azúcar. Confirmar composición y aditivos."],["Lote","L-141126 como ejemplo. Cada tanda tiene su identificación."],["Vida útil","El material propone 30 días: pendiente de validar."],["Envase","Ejemplo: bolsa de polipropileno y caja de 6 unidades, 180 g."],["Etiqueta","Nombre, ingredientes, contenido neto, fabricante, dirección, lote, vencimiento, conservación y registro."]],"label":"04 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-105","paper":"brand-106"},"notes":"Fuente: Registro Sanitario - Expo.pptx, diapositiva 3. Contenido original: PASO 2 DE 6 · QUÉ SE HACE Paso 2: Ficha técnica del producto. 1 Escribir la composición: ingredientes y aditivos con su código SIN. 2 Definir lote, envase, presentación, almacenamiento y tiempo de vida. 3 Diseñar el proyecto de rotulado, la etiqueta con su información mínima. 4 Hacer una ficha por producto: cada uno lleva su propio registro. La etiqueta final lleva el número de Registro Sanitario que DIGESA entrega en el paso 6. Chocoteja  de lúcuma, Mabell Ramos Ingredientes Chocolate de cobertura, manjar blanco, pasta de lúcuma, pecanas y azúcar. Sin aditivos. Lote L-141126: día, mes y año de producción. Cada tanda tiene el suyo. Vida útil 30 días en lugar fresco y seco, en su envase cerrado. Envase Bolsa de polipropileno dentro de caja de cartón: 6 unidades, 180 g netos. Etiqueta Nombre, ingredientes, contenido neto, fabricante y dirección, lote, vencimiento, conservación y Registro Sanitario. Mabell Ramos · Registro sanitario DIGESA PASO 2 DE 6\nAdaptación visual y resumen para exposición. Los requisitos, costos, plazos, acreditaciones y la vida útil deben verificarse antes del trámite. Las cifras de composición, envase y vida útil son ejemplos del material; no especificaciones validadas."},{"id":"san-lab","chapter":"Registro","theme":"cream","layout":"sandetail","title":"El siguiente hito:\nel laboratorio.","copy":"Paso 3 · Estamos aquí","actions":["Solicitar cotizaciones a dos o tres laboratorios y comprobar el alcance de su acreditación.","Entregar muestras del mismo lote, en el envase final.","Realizar los análisis fisicoquímicos y microbiológicos que correspondan.","Conservar el informe de ensayo en PDF para la solicitud."],"note":"El informe del laboratorio será parte del expediente que se presenta en el paso 4.","documentLabel":"PREPARACIÓN DE LAS MUESTRAS","documentTitle":"Chocoteja de lúcuma","fields":[["Laboratorio","El material menciona Bureau Veritas Perú. Confirmar acreditación y ensayos aplicables."],["Muestra","Producto terminado, tal como se venderá."],["Fisicoquímico","Definir con el laboratorio los parámetros necesarios para la formulación."],["Microbiológico","Revisar la categoría y los ensayos aplicables al chocolate con relleno. El material cita la RM 591-2008/MINSA."],["Resultado","Informe de ensayo identificado, con membrete y en PDF."]],"label":"04 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"notes":"Fuente: Registro Sanitario - Expo.pptx, diapositiva 4. Contenido original: PASO 3 DE 6 · QUÉ SE HACE ESTAMOS AQUÍ Paso 3: Análisis en laboratorio. 1 Elegir un laboratorio acreditado por INACAL y pedir cotización a 2 o 3. 2 Llevar muestras del producto terminado, tal como lo vas a vender. 3 Esperar el informe de ensayo: fisicoquímico y microbiológico. 4 Guardar el informe en PDF: se sube a la VUCE en el paso 4. El plazo de 10 a 20 días de DIGESA empieza cuando terminan los análisis. Chocoteja  de lúcuma en laboratorio Laboratorios Bureau  Veritas Perú,  con acreditación INACAL. Muestra Unidades del mismo lote, en su envase final. Fisicoquímico Humedad, grasa, proteína, acidez y azúcares, y lo que el laboratorio indique. Microbiológico RM 591-2008/MINSA. Referencia: el chocolate de cobertura se mide por E. coli, mohos y Salmonella; con relleno de manjar el laboratorio puede sumar más. Resultado Informe de ensayo con membrete, en PDF, para la VUCE. Mabell Ramos · Registro sanitario DIGESA PASO 3 DE 6\nAdaptación visual y resumen para exposición. Los requisitos, costos, plazos, acreditaciones y la vida útil deben verificarse antes del trámite. Las cifras de composición, envase y vida útil son ejemplos del material; no especificaciones validadas."},{"id":"san-siguientes","chapte
