ar su alcance.","branding":{"paper":"brand-122","pattern":"brand-108","ornament":"brand-116"}},{"id":"sabores","chapter":"Web","theme":"cream","layout":"collection","title":"Siete sabores.\nToda una colección.","copy":"Cuatro chocotejas y tres alfajores, tal como se presentan hoy en la web.","images":["live-web-chocotejas","live-web-alfajores"],"notes":"Las dos capturas muestran las secciones de chocotejas y alfajores. Ampliar cada pantalla para leer los sabores y sus descripciones.","branding":{"paper":"brand-120","pattern":"brand-109"}},{"id":"recorrido","chapter":"Web","theme":"lilac","layout":"webmobile","title":"Ver, elegir\ny consultar.","copy":"Al tocar «Consultar», se abre WhatsApp con el producto elegido y el contacto del negocio.","images":["live-web-alfajores","live-whatsapp-landing"],"notes":"El botón de cada producto dirige a WhatsApp al número 932 666 526 y prepara un mensaje con el sabor elegido. La captura muestra el destino real de la consulta de alfajores clásicos. El cliente decide si envía el mensaje; consultar no crea automáticamente un pedido en Mi día.","branding":{"paper":"brand-121","pattern":"brand-107"}},{"id":"catering","chapter":"Web","theme":"cream","layout":"catering","title":"Una reunión.\nUna propuesta a medida.","copy":"El formulario envía los datos del evento al correo del negocio para preparar la cotización.","images":["live-web-catering-form","live-web-catering-mobile-top"],"cta":"Abrir catering","link":"catering","notes":"La solicitud reúne nombre, WhatsApp, fecha, personas, distrito, alcance y comentario. Está configurada para enviar un correo a mabellramospe@gmail.com con un asunto que identifica el evento y los datos ordenados. No se envió una solicitud de prueba para esta presentación. La solicitud no confirma una reserva.","branding":{"paper":"brand-106","pattern":"brand-108"}},{"id":"web-vivo","chapter":"Web","theme":"plum","layout":"webdemo","title":"Reseñas con\norigen visible.","copy":"Cada reseña enlaza al comentario original en Instagram para que el cliente pueda consultarlo.","images":["live-web-contact","live-web-review-mobile"],"cta":"Ver comentario original","link":"instagramReview","notes":"La web muestra testimonios y ofrece un enlace al comentario original en Instagram. El botón abre el comentario que aparece en la captura. Esto permite consultar su procedencia; no es una sincronización automática de reseñas. Instagram puede pedir iniciar sesión.","branding":{"paper":"brand-122","pattern":"brand-105"}},{"id":"app","chapter":"App","theme":"lilac","layout":"appintro","title":"Mi día,\nen el celular.","copy":"Lo que una registra, la otra puede verlo. Ambas consultan la misma base de datos.","images":["live-app-hoy","live-app-pedidos"],"cta":"Abrir la app","link":"app","notes":"La app guarda los registros en una base de datos D1 de Cloudflare, fuera de los celulares. Así, ambas consultan el mismo negocio y los cambios guardados se reflejan en el otro equipo cuando se sincroniza con internet. Si los datos se guardaran solo en un celular, el otro no podría consultarlos. La clave del negocio no está incluida en la presentación.","branding":{"paper":"brand-121","pattern":"brand-107"}},{"id":"hoy","chapter":"App","theme":"cream","layout":"today","title":"Lo próximo,\na primera vista.","copy":"Entregas próximas, acciones rápidas y dinero de hoy y del mes.","images":["live-app-hoy","live-app-hoy-bottom"],"notes":"Mostrar la fecha, las entregas próximas y las acciones Nuevo pedido, Vendí algo y Anotar gasto. Las pantallas son ejemplos del uso de la app: no presentan sus importes como indicadores reales del negocio.","branding":{"paper":"brand-120","pattern":"brand-109"}},{"id":"pedidos","chapter":"App","theme":"cream","layout":"orders","title":"Del pedido\na la entrega.","copy":"Registrar primero. Consultar y actualizar cada pedido después.","images":["live-app-new-order","live-app-detail"],"notes":"Guardar pedido registra el pedido y su estado se cambia desde el detalle. Contacto y dirección son opcionales. Las capturas de detalle y edición usan datos ficticios, sin contacto personal. Se pueden registrar pagos y corregir errores.","branding":{"paper":"brand-124","pattern":"brand-108"},"galleries":[{"label":"Registrar","screens":[["Pedido","live-app-new-order"],["Entrega","live-app-order-contact"]]},{"label":"Dar seguimiento","screens":[["Detalle","live-app-detail"],["Editar","live-app-edit-order"],["Lista","live-app-pedidos"]]}]},{"id":"dinero","chapter":"App","theme":"plum","layout":"money","title":"El dinero,\nmás claro.","copy":"Lo recibido, lo gastado y lo que falta cobrar. Hoy y durante el mes.","images":["live-app-dinero","live-app-expense"],"notes":"Mostrar la vista mensual y el registro de gastos. Los cobros y gastos son movimientos de dinero; no afirmar que esta pantalla calcula la utilidad del negocio. Los costos por receta y el trabajo propio forman parte de otros pendientes del plan. Los importes son los que estaban visibles en la app al tomar la captura; no se presentan como resultados de la intervención.","branding":{"pattern":"brand-107"},"galleries":[{"label":"El panorama","screens":[["Resumen","live-app-dinero"],["Movimientos","live-app-movimientos"]]},{"label":"Los registros","screens":[["Gasto","live-app-expense"],["Excel","live-app-excel"]]}]},{"id":"autonomia","chapter":"App","theme":"lilac","layout":"autonomy","title":"Una app que\npueden adaptar.","copy":"Pueden crear y actualizar productos, cambiar precios y fotos, y ajustar los datos del negocio.","images":["live-app-alfajores","live-app-help"],"notes":"Mostrar Productos y luego Editar para explicar qué pueden cambiar por sí mismas: nombre, presentación, precio y foto. También pueden pausar productos y corregir datos del negocio desde Ayuda. Los cambios se guardan en la app compartida; no actualizan automáticamente la web ni el catálogo.","branding":{"paper":"brand-106","pattern":"brand-105"},"galleries":[{"label":"Su colección","screens":[["Productos","live-app-alfajores"],["Editar","live-app-edit-product"]]},{"label":"Su negocio","screens":[["Ayuda","live-app-help"],["Ajustes","live-app-business"],["Conexión","live-app-health"]]}]},{"id":"excel","chapter":"Excel","theme":"cream","layout":"excel","title":"Todo lo anotado,\nen Excel","copy":"Descargan el historial registrado en la app para revisarlo, filtrarlo o compartirlo.","label":"03 / Exportar los registros","images":["live-app-excel"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"En Dinero o Ayuda, tocar Exportar Excel y después Descargar Excel. El archivo reúne cinco hojas: Resumen, Pedidos, Detalle, Movimientos y Productos. Incluye los datos compartidos descargados hasta ese momento; volver a exportar incorpora nuevos registros. La pantalla del celular es una captura de la app. La tabla de esta diapositiva es una vista simplificada con datos ficticios de ejemplo, no una captura de Microsoft Excel ni cifras reales del negocio. Conserva los tipos de datos de la exportación. Los cambios hechos en Excel no regresan a la app; las fotos de productos no se incluyen en el archivo."},{"id":"control-puente","chapter":"Excel","theme":"plum","layout":"financebridge","title":"De las ventas\na los resultados.","copy":"Los registros de la app son el punto de partida. Al sumar los costos, podemos analizar precios, márgenes y metas de venta.","label":"03 / Del registro al control financiero","images":["live-app-excel"],"branding":{"pattern":"brand-107"},"notes":"Transición sugerida: «Ya vimos cómo descargar los registros. Ahora mi compañero mostrará cómo complementarlos con los costos para entender los resultados del negocio». El archivo Control_Mabell_Ramos.xlsm tiene cinco hojas y no dispone de una importación automática de la app. El traslado requiere revisar ventas confirmadas, hacer coincidir nombres de producto y completar canal, unidades producidas, costos y precios aplicables. Los cobros o adelantos no deben confundirse con unidades vendidas. La app exporta precios históricos por pedido; el formulario de este Excel usa el precio vigente, por lo que deben conciliarse descuentos y ventas históricas al trasladarlas. Los botones del archivo funcionan con macros en Excel de escritorio. Esta presentación describe el flujo propuesto y las funciones verificadas; no implementa una nueva integración."},{"id":"control-costos","chapter":"Excel","theme":"cream","layout":"financecosts","title":"Cada producto,\ncon sus costos claros.","copy":"Insumos, empaque y gastos del negocio: la base para revisar cuánto cuesta producir y a qué precio vender.","label":"03 / Costos y precios","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Recorrer las tres pestañas. Costos_Tanda suma los conceptos por producto y divide el total entre las unidades de la tanda, actualmente 60. Los dos productos y sus importes son ejemplos del archivo, no costos reales validados. El costo del alfajor suma S/ 56.50 y el de la chocoteja S/ 60.93. Costos_Fijos reúne gastos mensuales, cuyos importes todavía están vacíos; la vista agrupa algunos conceptos para facilitar la lectura. Precios toma el costo unitario, permite ingresar el precio de venta y calcula la diferencia, su porcentaje sobre el precio y un precio sugerido con margen objetivo. Usamos el término aporte por unidad porque todavía falta cubrir los costos fijos. Las cifras visibles se redondean, pero el cálculo usa la precisión completa del archivo. Las tablas son representaciones simplificadas, no capturas de Microsoft Excel. El catálogo de productos y conceptos se puede adaptar."},{"id":"control-resultados","chapter":"Excel","theme":"lilac","layout":"financeresults","title":"Cuánto vender.\nCómo va el negocio.","copy":"El control reúne las ventas por canal y calcula la meta mensual, su avance y el resultado después de costos.","label":"03 / Ventas y resultados financieros","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-105"},"notes":"Recorrer Ventas_Canales y Punto_Equilibrio. El archivo permite registrar fecha, canal (Catering, Feria o Pedido), producto, unidades producidas y vendidas. Calcula ingresos, costo producido y sobrantes; el resumen por canal es acumulado, no está filtrado por mes. Punto_Equilibrio calcula metas por producto y un promedio suponiendo que todos los productos se venden por igual. Permite añadir ganancia deseada, muestra una referencia semanal dividiendo entre 4.3 y selecciona el mes para medir el avance. El resultado mensual es ingresos menos costo de toda la producción del mes menos costos fijos, según la fórmula del archivo; no es un estado de resultados contable completo ni equivale al efectivo cobrado. Ejemplo ilustrativo: 120 alfajores producidos, 110 vendidos a S/ 2.50 por Catering; 60 chocotejas producidas y 50 vendidas a S/ 3 por Feria; otras 60 producidas y vendidas por Pedido. Todos los registros del ejemplo corresponden al mismo mes. Ingresos S/ 605; costo producido S/ 234.86; sobrantes 20 unidades. Con S/ 300 de costos fijos, ganancia objetivo cero y mezcla de ventas 50/50, la meta es 170 unidades o S/ 467.50. El avance es 129.4% y el resultado mensual S/ 70.14. Estos datos ilustran las fórmulas del archivo; no son cifras reales del negocio. Para usar sus botones, abrir el .xlsm en Excel de escritorio con las macros autorizadas."}],"captured":"13 de noviembre de 2026","captureISO":"2026-11-13","designVersion":5};window.MABELL_ASSETS={"logo":"./assets/logo.webp","bodoni-moda-600":"./assets/bodoni-moda-600.woff2","inter-400":"./assets/inter-400.woff2","inter-600":"./assets/inter-600.woff2","live-web-home":"./assets/live-web-home.webp","live-web-chocotejas":"./assets/live-web-chocotejas.webp","live-web-alfajores":"./assets/live-web-alfajores.webp","live-web-contact":"./assets/live-web-contact.webp","live-web-catering":"./assets/live-web-catering.webp","live-web-catering-form":"./assets/live-web-catering-form.webp","live-web-mobile":"./assets/live-web-mobile.webp","live-app-hoy":"./asset
