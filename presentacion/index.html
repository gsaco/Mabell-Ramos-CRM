</style></head><body><div id="root"></div><noscript>Activa JavaScript para recorrer la presentación interactiva de Mabell Ramos.</noscript><script>window.MABELL_DECK={"title":"Mabell Ramos · Asesoría y entregables","links":{"web":"https://gsaco.github.io/Mabell-Ramos/","productos":"https://gsaco.github.io/Mabell-Ramos/productos/","catering":"https://gsaco.github.io/Mabell-Ramos/catering/","app":"https://mabell-mi-dia.mabell-ramos-mi-dia.workers.dev/","whatsapp":"https://wa.me/51932666526?text=Hola%2C%20me%20gustar%C3%ADa%20consultar%20por%20alfajores%20cl%C3%A1sicos.%20%C2%BFQu%C3%A9%20presentaciones%20y%20cantidades%20tienen%20disponibles%3F","instagramReview":"https://www.instagram.com/p/DdzFxx-EXhM/c/18100571444382499/","excel":"https://raw.githubusercontent.com/gsaco/Mabell-Ramos/main/entregables/Control_Mabell_Ramos.xlsm"},"slides":[{"id":"oferta","chapter":"Inicio","theme":"cream","layout":"opening","title":"Mabell\nRamos","copy":"Organización comercial y gestión compartida para Mabell y Ana","label":"Asesoría a Mabell Ramos","images":["cover-web-current","cover-web-mobile-current"],"cta":"Explorar la página web","link":"web","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Presentar al equipo y a las emprendedoras. El propósito fue ordenar la oferta, coordinar pedidos y disponer de información para revisar costos y precios. El recorrido muestra lo desarrollado, cómo se trabajó con ambas y qué continúa después de la asesoría.","branding":{"paper":"brand-106","pattern":"brand-105","ornament":"brand-115"},"team":["Gabriel Andreas Saco Alvarado","Valentina Dahiana Paca Nuñez","Zahir Sebastian Melquiades Velasquez"],"logos":[{"asset":"logo","alt":"Logo original de Mabell Ramos"},{"asset":"logo-up","alt":"Universidad del Pacífico"}]},{"id":"lineas","chapter":"Web","theme":"plum","layout":"lines","title":"Productos y catering,\ncon atención diferenciada","copy":"Una misma marca. Información y canales de solicitud adecuados para cada compra.","images":["live-web-chocotejas","live-web-catering"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE3. Productos se consulta por WhatsApp. Catering reúne los datos del evento en el formulario conectado al correo. Las emprendedoras validaron esa separación. La confirmación requiere revisar alcance, recursos y disponibilidad.","branding":{"paper":"brand-122","pattern":"brand-108","ornament":"brand-116"},"label":"02 / Oferta y atención"},{"id":"sabores","chapter":"Web","theme":"cream","layout":"collection","title":"Siete productos\nseleccionados con ellas","copy":"Identidad, buena acogida y facilidad de elaboración orientaron la selección con Mabell y Ana.","images":["live-web-chocotejas","live-web-alfajores"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1 y Anexo 3. Cuatro chocotejas: lúcuma, ají, frejol colado y manjar de pallar. Tres alfajores: clásico, cañihua y pistacho con arándano. Las preparaciones afroperuanas conviven con sabores complementarios. Los siete están en la web y predefinidos en la app. Se trabajaron referencias, composición, iluminación, fondos y acabados con edición y generación asistida. Son imágenes comerciales diseñadas, no fotografías documentales de una entrega.","branding":{"paper":"brand-120","pattern":"brand-109"},"label":"02 / Oferta y atención"},{"id":"recorrido","chapter":"Web","theme":"lilac","layout":"funnel","title":"De las redes\na la consulta por WhatsApp","copy":"La web presenta una oferta acotada y prepara el primer contacto con el producto elegido.","images":["instagram-after","live-web-alfajores","live-whatsapp-landing"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Anexo 2. El contenido de TikTok e Instagram puede conducir a la web. Allí se conoce la historia y la oferta y se abre una consulta preparada en WhatsApp. La intención es facilitar la elección. El efecto sobre ventas se medirá en la campaña. El cliente decide si envía el mensaje. Consultar no crea automáticamente un pedido en la app.","branding":{"paper":"brand-121","pattern":"brand-107"},"label":"02 / Oferta y atención"},{"id":"catering","chapter":"Web","theme":"cream","layout":"catering","title":"La información del evento,\nlista para cotizar","copy":"El formulario reúne contacto, fecha, personas, distrito y alcance, y envía la solicitud al correo.","images":["live-web-catering-form","live-web-catering-mobile-top"],"cta":"Abrir catering","link":"catering","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE3 y sección 9. La recepción de una solicitud de prueba fue confirmada. Ambas revisaron los campos. La reserva se acuerda después de comprobar disponibilidad, recursos y precio. No mostrar la dirección de correo. El envío no se incorpora automáticamente a la app.","branding":{"paper":"brand-106","pattern":"brand-108"},"label":"02 / Oferta y atención"},{"id":"web-vivo","chapter":"Web","theme":"plum","layout":"trust","title":"La historia\ndetrás de la marca","copy":"Ana propuso que la web explicara quiénes están detrás del negocio. Adaptamos e integramos el video que nos compartieron.","images":["cover-web-current","live-web-contact"],"cta":"Ver historia en la web","link":"web","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1, OE5 y Anexo 2. El video fue proporcionado por las emprendedoras y adaptado e integrado por el equipo. No atribuir al equipo su filmación original. La web también enlaza reseñas a su comentario original en Instagram. No afirmar una mejora de conversión medida.","branding":{"paper":"brand-122","pattern":"brand-105"},"label":"02 / Oferta y atención"},{"id":"instagram-evolucion","chapter":"Web","theme":"plum","layout":"identity","title":"La misma identidad\nen cada contacto","copy":"Colores, tipografías, patrones e imágenes acordados con Mabell y Ana para redes, web y app.","images":["instagram-before","instagram-after","chocoteja-aji","live-app-alfajores","cover-web-current"],"label":"02 / Oferta y atención","branding":{"pattern":"brand-107"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE5 y sección 9. El antes y después muestra portadas de historias destacadas y nuevos carruseles. Se diseñaron imágenes comerciales y prepararon piezas audiovisuales y promocionales. El contenido quedó validado para activar la campaña. No atribuir variaciones de seguidores o ventas al rediseño."},{"id":"app","chapter":"App","theme":"lilac","layout":"appintro","title":"Mabell Ramos App:\ngestión compartida","copy":"Lo que una registra, la otra puede consultarlo. Ambas trabajan con la misma información.","images":["live-app-hoy","live-app-pedidos"],"cta":"Abrir la app","link":"app","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 5. Se evaluaron almacenamiento, sincronización, costo y capacidad. GitHub Pages se usa para la web. Cloudflare Workers y D1 sostienen los datos compartidos de la app. Se sincroniza con internet. Puede añadirse al inicio del celular. Sin conexión permite consultar lo descargado. La clave no se muestra en la presentación.","branding":{"paper":"brand-121","pattern":"brand-107"},"label":"03 / Gestión compartida"},{"id":"hoy","chapter":"App","theme":"cream","layout":"todayfocus","title":"Las entregas,\na primera vista","copy":"Hoy reúne las próximas entregas para que ambas puedan coordinar preparación, compras y horarios.","images":["live-app-hoy"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 5. Ampliar Próximas entregas y mostrar Nuevo pedido, Vendí algo y Anotar gasto. Son acciones revisadas con las emprendedoras. La captura muestra la interfaz, no resultados de ventas de la asesoría.","branding":{"paper":"brand-120","pattern":"brand-109"},"label":"03 / Gestión compartida"},{"id":"pedidos","chapter":"App","theme":"cream","layout":"orders","title":"Cada pedido,\ncon sus acuerdos","copy":"Cliente, teléfono, cantidades, entrega, adelanto y saldo quedan asociados al mismo pedido.","images":["live-app-new-order","live-app-detail"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4, OE5 y Anexo 5. Las notas conservan preferencias y acuerdos. La búsqueda y Repetir pedido ayudan a retomar clientes, revisando precios y condiciones vigentes. Las capturas de detalle y edición usan datos de demostración, sin contacto personal.","branding":{"paper":"brand-124","pattern":"brand-108"},"galleries":[{"label":"Registrar","screens":[["Pedido","live-app-new-order"],["Entrega","live-app-order-contact"]]},{"label":"Dar seguimiento","screens":[["Detalle","live-app-detail"],["Editar","live-app-edit-order"],["Lista","live-app-pedidos"]]}],"label":"03 / Gestión compartida"},{"id":"dinero","chapter":"App","theme":"plum","layout":"money","title":"Registrar en la feria\ny revisar después","copy":"Vendí algo guarda la venta y su cobro. Anotar gasto registra el desembolso. Dinero reúne cobros, gastos y saldos.","images":["live-app-dinero","live-app-expense"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4, Anexo 5 y sección 11.5. Al terminar una feria se contrastan registros y medios de pago. Cobros y gastos son movimientos de dinero. La utilidad requiere completar costos y producción en el Excel. Las capturas no muestran indicadores reales de la intervención.","branding":{"pattern":"brand-107"},"galleries":[{"label":"El panorama","screens":[["Resumen","live-app-dinero"],["Movimientos","live-app-movimientos"]]},{"label":"Los registros","screens":[["Gasto","live-app-expense"],["Excel","live-app-excel"]]}],"label":"03 / Gestión compartida"},{"id":"autonomia","chapter":"App","theme":"lilac","layout":"autonomy","title":"Una app flexible\npara su negocio","copy":"Pueden añadir productos, cambiar precios y subir fotos desde el celular, conservando los pedidos anteriores.","images":["live-app-alfajores","live-app-help"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1 y OE4. Mostrar primero Editar producto. Pueden cambiar nombre, presentación, precio y foto, pausar referencias y gestionar paquetes. La app se añade al inicio del celular. La edición del catálogo no actualiza automáticamente la web. Los cambios fuera de los campos editables pueden requerir apoyo técnico.","branding":{"paper":"brand-106","pattern":"brand-105"},"galleries":[{"label":"Su colección","screens":[["Editar","live-app-edit-product"],["Productos","live-app-alfajores"]]},{"label":"Su negocio","screens":[["Ayuda","live-app-help"],["Ajustes","live-app-business"],["Conexión","live-app-health"]]}],"label":"03 / Gestión compartida"},{"id":"excel","chapter":"Excel","theme":"cream","layout":"excel","title":"Cinco hojas para\nconservar lo registrado","copy":"Pedidos, clientes, productos, pagos y gastos quedan organizados en un archivo que pueden descargar.","label":"04 / Control financiero","images":["live-app-excel"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Anexo 5. Cinco hojas: Resumen, Pedidos, Detalle, Movimientos y Productos. La tabla contiene datos ficticios. Seguir Cliente 02: seis alfajores, venta S/30, cobrado S/15 y saldo S/15. El mismo caso continúa en la siguiente diapositiva. Cada descarga refleja lo disponible en ese momento. No incluye fotos. Los cambios de Excel no regresan a la app."},{"id":"control-puente","chapter":"Excel","theme":"plum","layout":"financebridge","title":"Del registro diario\nal análisis de costos","copy":"El historial permite revisar las ventas y trasladarlas al control financiero, completando producción y costos.","label":"04 / Control financiero","images":["live-app-excel"],"branding":{"pattern":"brand-107"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 6. Continuar el caso ficticio Cliente 02: seis alfajores, venta S/30, cobrado S/15, saldo S/15. Revisar cantidades y precios y completar canal, producción y costos. El traslado es manual, sin sincronización automática. Los adelantos no se suman como ventas adicionales. Los costos de ejemplo se actualizarán con datos reales."},{"id":"control-costos","chapter":"Excel","theme":"cream","layout":"financecosts","title":"Conocer los costos\npara revisar los precios","copy":"El costo por tanda y los gastos fijos permiten evaluar cuánto aporta cada producto y qué precio puede sostenerlo.","label":"04 / Control financiero","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Abrir primero Costos_Fijos y después Costos_Tanda y Precios. Recorrer las tres pestañas. Costos_Tanda suma los conceptos por producto y divide el total entre las unidades de la tanda, actualmente 60. Los dos productos y sus importes son ejemplos del archivo, no costos reales validados. El costo del alfajor suma S/ 56.50 y el de la chocoteja S/ 60.93. Costos_Fijos reúne gastos mensuales, cuyos importes todavía están vacíos; la vista agrupa algunos conceptos para facilitar la lectura. Precios toma el costo unitario, permite ingresar el precio de venta y calcula la diferencia, su porcentaje sobre el precio y un precio sugerido con margen objetivo. Usamos el término aporte por unidad porque todavía falta cubrir los costos fijos. Las cifras visibles se redondean, pero el cálculo usa la precisión completa del archivo. Las tablas son representaciones simplificadas, no capturas de Microsoft Excel. El catálogo de productos y conceptos se puede adaptar."},{"id":"control-resultados","chapter":"Excel","theme":"lilac","layout":"financeresults","title":"Una referencia clara\nde cuánto vender","copy":"El punto de equilibrio relaciona los costos fijos con el aporte de las ventas. Los registros permiten revisar el avance.","label":"04 / Control financiero","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-105"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Abrir primero Punto_Equilibrio y después Ventas_Canales. Recorrer Ventas_Canales y Punto_Equilibrio. El archivo permite registrar fecha, canal (Catering, Feria o Pedido), producto, unidades producidas y vendidas. Calcula ingresos, costo producido y sobrantes; el resumen por canal es acumulado, no está filtrado por mes. Punto_Equilibrio calcula metas por producto y un promedio suponiendo que todos los productos se venden por igual. Permite añadir ganancia deseada, muestra una referencia semanal dividiendo entre 4.3 y selecciona el mes para medir el avance. El resultado mensual es ingresos menos costo de toda la producción del mes menos costos fijos, según la fórmula del archivo; no es un estado de resultados contable completo ni equivale al efectivo cobrado. Ejemplo ilustrativo: 120 alfajores producidos, 110 vendidos a S/ 2.50 por Catering; 60 chocotejas producidas y 50 vendidas a S/ 3 por Feria; otras 60 producidas y vendidas por Pedido. Todos los registros del ejemplo corresponden al mismo mes. Ingresos S/ 605; costo producido S/ 234.86; sobrantes 20 unidades. Con S/ 300 de costos fijos, ganancia objetivo cero y mezcla de ventas 50/50, la meta es 170 unidades o S/ 467.50. El avance es 129.4% y el resultado mensual S/ 70.14. Estos datos ilustran las fórmulas del archivo; no son cifras reales del negocio. Para usar sus botones, abrir el .xlsm en Excel de escritorio con las macros autorizadas."},{"id":"san-ruta","chapter":"Registro","theme":"lilac","layout":"sanroute","title":"Registro sanitario:\nel avance de la asesoría","copy":"Avanzamos en la ruta de la chocoteja de lúcuma. El Anexo 7 reúne las fichas técnicas y de análisis de lúcuma y alfajor clásico.","steps":[["RUC y Clave SOL","Preparar el acceso a la VUCE."],["Ficha técnica","Composición, lote, envase y rotulado."],["Análisis en laboratorio","Cotizar y realizar los ensayos del producto."],["Solicitud en VUCE","Reunir el informe y la documentación."],["Costos y observaciones","Verificar la tasa vigente y responder observaciones."],["Registro y etiqueta","Incorporar el código y controlar su vigencia."]],"label":"05 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-105","paper":"brand-106"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Secciones 8.4 y 9. El avance reportado está en el paso 3 de seis. Se preparó documentación y se avanzó en laboratorio. No se presenta el registro como obtenido. Receta, vida útil, presentación y documentos deben confirmarse. El apoyo conserva detalle de los tres primeros pasos. El Anexo 7 añade seis tablas de trabajo para dos productos, con los campos pendientes identificados."},{"chapter":"Registro","theme":"cream","layout":"santables","label":"05 / Registro sanitario · Anexo 7","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"id":"san-alfajor-tecnica","product":"Alfajor clásico","title":"Alfajor clásico:\nla ficha del producto","copy":"Mabell Ramos · Ana Joya\nReceta de la hoja de costos. Datos de presentación y conservación por confirmar.","rows":[["Producto","Dos galletas de masa mantecosa unidas con manjar blanco. Listo para consumir."],["Ingredientes","Harina de trigo, manjar blanco, mantequilla, huevo y azúcar."],["Aditivos y alérgenos","Sin aditivos. Contiene gluten (trigo), leche y huevo."],["Presentación","Bolsa de polipropileno individual con sticker. Peso aproximado: 40 g por unidad."],["Conservación","Lugar fresco y seco, lejos del sol y la humedad. Vida útil propuesta: 20 días en envase cerrado."],["Trazabilidad","Lote L-DDMMAA y fecha de vencimiento. Ejemplo de lote: L-141126."]],"recipe":"Harina 1 kg · Manjar blanco 800 g · Mantequilla 400 g · Huevos 4 unidades · Azúcar 120 g.","confirmation":"Pesar el producto terminado, validar la vida útil y completar los datos del fabricante para el rotulado.","notes":"Anexo 7, ficha técnica 7.1. Receta base tomada de la hoja de costos. Los demás campos son propuestas por confirmar. El anexo incluye el proceso de nueve pasos, los puntos de control y el contenido de la etiqueta. El horneado de referencia es 170–180 °C durante 12–15 minutos, ajustable al horno."},{"chapter":"Registro","theme":"lilac","layout":"santables","label":"05 / Registro sanitario · Anexo 7","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"id":"san-alfajor-analisis","product":"Alfajor clásico","title":"Alfajor clásico:\npreparar los análisis","copy":"Dos fichas ordenan muestras, ensayos y entrega. Incluyen el alfajor clásico y el de cobertura de chocolate.","panels":[{"number":"01","title":"Fisicoquímico","rows":[["Muestras","200 g por muestra, en envase sellado. Una de alfajor clásico y otra con cobertura de chocolate."],["Parámetros","Humedad y bromato de potasio."],["Identificación","Lote y fecha de elaboración. Vencimiento propuesto a 20 días."],["Envío","Temperatura ambiente, caja cerrada, sin sol ni humedad."]],"note":"Según la proforma SAT Perú PRO-14486-2026-01 citada en el Anexo 7."},{"number":"02","title":"Microbiológico","rows":[["Muestras","300 g por muestra, en envase sellado y del mismo lote. Una por cada variante."],["Parámetros","Bacillus cereus, E. coli, mohos y Staphylococcus aureus (numeración). Salmonella (detección)."],["Identificación","El mismo lote que en el análisis fisicoquímico."],["Envío","El día de elaboración o según indique el laboratorio."]],"note":"Referencia del material: RM 591-2008/MINSA. El laboratorio confirma el grupo de alimento."}],"confirmation":"Completar RUC, dirección y teléfono. Confirmar el grupo de alimento, el lote real y las condiciones de entrega.","notes":"Anexo 7, fichas 7.2 y 7.3. Las cantidades y parámetros corresponden a la proforma SAT Perú citada por el equipo. Son fichas para solicitar análisis, no resultados de ensayo. La ficha microbiológica también cita RM 1020-2010/MINSA para panadería, galletería y pastelería."},{"chapter":"Registro","theme":"cream","layout":"santables","label":"05 / Registro sanitario · Anexo 7","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"id":"san-lucuma-tecnica","product":"Chocoteja de lúcuma","title":"Chocoteja de lúcuma:\nla ficha del producto","copy":"Mabell Ramos · Ana Joya\nLa formulación y su presentación quedan documentadas para revisión.","rows":[["Ingredientes","Chocolate de cobertura, manjar blanco, pasta de lúcuma, leche condensada y sorbato de potasio."],["Conservante","Sorbato de potasio, SIN 202. Incorporado al relleno."],["Dosis de ejemplo","0,05 % del peso del relleno: 0,55 g por 1,1 kg. Por confirmar con el proveedor y la norma aplicable."],["Alérgenos","Leche y soya según el chocolate. Posibles trazas de gluten, maní y frutos secos por cocina compartida."],["Presentación","Bolsa de polipropileno individual con sticker. Peso aproximado: 30 g por unidad."],["Conservación","Lugar fresco y seco, idealmente bajo 25 °C. Vida útil propuesta: 30 días en envase cerrado."]],"recipe":"Chocolate 800 g · Manjar blanco 400 g · Lúcuma 400 g · Leche condensada 300 g · Sorbato 0,55 g (dosis de ejemplo).","confirmation":"Revisar el chocolate del proveedor, la dosis del conservante, el peso neto, la vida útil y el rotulado.","notes":"Anexo 7, ficha 7.4. La dosis de sorbato es un ejemplo de trabajo, no una validación técnica o normativa. El anexo conserva proceso de ocho pasos, control de pesado y mezcla, y datos de la etiqueta. Las fichas de análisis usan el lote L-111126 como ejemplo, que debe corresponder al lote real de la muestra."},{"chapter":"Registro","theme":"lilac","layout":"santables","label":"05 / Registro sanitario · Anexo 7","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"id":"san-lucuma-analisis","product":"Chocoteja de lúcuma","title":"Chocoteja de lúcuma:\npreparar los análisis","copy":"Las fichas precisan qué consultar al laboratorio para una formulación con relleno de manjar y lúcuma.","panels":[{"number":"01","title":"Fisicoquímico","rows":[["Muestra","Unidades del mismo lote, en su envase original. Referencia: 200 g."],["Parámetros","Humedad, grasa, proteína, ceniza, acidez y azúcares."],["Conservante","Sorbato como ácido sórbico (mg/kg), si el laboratorio ofrece el ensayo."],["Envío","Ambiente fresco, caja cerrada y lejos del sol."]],"note":"El laboratorio confirma el peso requerido y el alcance de los ensayos."},{"number":"02","title":"Microbiológico","rows":[["Muestra","Referencia: 5 unidades del mismo lote, en su envase original cerrado."],["Parámetros","E. coli, mohos y Salmonella como referencia inicial."],["Alcance","La referencia corresponde a chocolate sin relleno. El laboratorio debe ajustarla a esta formulación."],["Envío","Ambiente fresco y según indique el laboratorio."]],"note":"El laboratorio confirma el plan de muestreo y los ensayos adicionales por el relleno."}],"confirmation":"Declarar el sorbato, completar los datos del solicitante y confirmar lote, fechas, muestreo y ensayos aplicables.","notes":"Anexo 7, fichas 7.5 y 7.6. El material cita RM 591-2008/MINSA y un tarifario para chocolate sin relleno. La chocoteja contiene manjar y lúcuma: el laboratorio debe confirmar la categoría y puede añadir ensayos. No se presentan informes de resultados ni un registro concedido."},{"id":"acompanamiento","layout":"training","title":"Diseñar con ellas\ny aprender con el uso","copy":"Las herramientas quedaron entregadas y validadas con ambas emprendedoras. La capacitación incluyó ejemplos, casos y práctica recurrente.","chapter":"Cierre","theme":"cream","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"06 / Acompañamiento","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Sección 8.4 y lecciones. Mabell orientó sabores y regalos. Ana destacó el video y orientó la web y app. Zahir capacitó reiteradamente a Mabell en Excel y Gabriel acompañó a Ana en las herramientas digitales. Valentina coordinó el OE5. Ambas registraron operaciones y señalaron utilidad. Se atendieron consultas y se reforzó la práctica porque Mabell explicó que podía olvidar una primera explicación. No inventar un número de sesiones ni afirmar autonomía sostenida medida."},{"id":"continuidad","layout":"future","title":"Los próximos\nseis meses","copy":"","chapter":"Cierre","theme":"lilac","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"06 / Continuidad y aprendizaje","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Sección 11. M1: dos piezas y piloto de siete días, prueba del recorrido y seguimiento de clientes. M1–M2: actualizar los costos de los siete productos según cambien insumos, recetas, rendimientos, empaques o trabajo. Cada mes: revisión de pedidos, cobros, producción y equilibrio, con traslado manual al Excel. Mantener los hábitos aprendidos con las herramientas entregadas y validadas y continuar la ruta sanitaria. Son metas propuestas. La continuidad requiere práctica recurrente y ajustes según el uso."},{"id":"san-acceso","chapter":"Apoyo","theme":"cream","layout":"sandetail","title":"Primero,\nel acceso al trámite","copy":"Paso 1 · RUC y Clave SOL","actions":["Confirmar que el RUC de Ana esté activo como persona natural con negocio.","Actualizar correo y celular de la ficha RUC.","Generar o recuperar la Clave SOL.","Probar el ingreso a la VUCE y elegir DIGESA."],"note":"Este paso se cierra al comprobar que Ana puede ingresar a la VUCE.","documentLabel":"ACCESO AL TRÁMITE","documentTitle":"Ana Joya · Titular","fields":[["RUC","Persona natural con negocio. Según el material, Ana ya cuenta con él."],["Ficha RUC","Correo y celular actualizados para gestionar el acceso."],["Clave SOL","Generación o recuperación desde los canales de SUNAT."],["VUCE","Ingreso con RUC, usuario y Clave SOL. Entidad: DIGESA."]],"label":"Material de apoyo / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Detalle de la ruta sanitaria adaptado del material del equipo. El estado reportado es paso 3. Composición, vida útil, envase y presentación de los ejemplos requieren confirmación. Requisitos, ensayos y costos se revisan al realizar el trámite. No atribuir aprobación del registro a estas gestiones.","appendix":true},{"id":"san-ficha","chapter":"Apoyo","theme":"lilac","layout":"sandetail","title":"El producto,\nbien documentado","copy":"Paso 2 · Ficha técnica y proyecto de rotulado","actions":["Detallar ingredientes y aditivos, con su código SIN cuando corresponda.","Definir lote, envase, presentación, conservación y vida útil.","Preparar la etiqueta con la información del producto.","Organizar la ficha y revisar el alcance del registro solicitado."],"note":"La dosis del conservante, el peso neto y la vida útil propuestos deben confirmarse antes de presentar el expediente.","documentLabel":"ANEXO 7 · FICHA DE TRABAJO","documentTitle":"Chocoteja de lúcuma","fields":[["Ingredientes","Chocolate de cobertura, manjar blanco, pasta de lúcuma, leche condensada y sorbato de potasio (SIN 202)."],["Lote","L-141126 como ejemplo. Cada tanda tiene su identificación."],["Vida útil","El material propone 30 días: pendiente de validar."],["Envase","Bolsa de polipropileno individual con sticker. Peso aproximado: 30 g por unidad, por confirmar."],["Etiqueta","Nombre, ingredientes, contenido neto, fabricante, dirección, lote, vencimiento, conservación y registro."]],"label":"Material de apoyo / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-105","paper":"brand-106"},"notes":"Anexo 7, ficha técnica de chocoteja de lúcuma. Conserva propuestas pendientes de confirmación: dosis de sorbato, peso neto, vida útil, composición del chocolate y rotulado.","appendix":true},{"id":"san-lab","chapter":"Apoyo","theme":"cream","layout":"sandetail","title":"El siguiente hito:\nel laboratorio","copy":"Paso 3 · Estamos aquí","actions":["Solicitar cotizaciones a dos o tres laboratorios y comprobar el alcance de su acreditación.","Entregar muestras del mismo lote, en el envase final.","Realizar los análisis fisicoquímicos y microbiológicos que correspondan.","Conservar el informe de ensayo en PDF para la solicitud."],"note":"El informe del laboratorio será parte del expediente que se presenta en el paso 4.","documentLabel":"ANEXO 7 · PREPARACIÓN DE MUESTRAS","documentTitle":"Chocoteja de lúcuma","fields":[["Laboratorio","Confirmar laboratorio, acreditación y alcance para la chocoteja con relleno de manjar y lúcuma."],["Muestra","Envase original y mismo lote. Referencias de peso y unidades en el Anexo 7, por confirmar con el laboratorio."],["Fisicoquímico","Definir con el laboratorio los parámetros necesarios para la formulación."],["Microbiológico","Revisar la categoría y los ensayos aplicables al chocolate con relleno. El material cita la RM 591-2008/MINSA."],["Resultado","Informe de ensayo identificado, con membrete y en PDF."]],"label":"Material de apoyo / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-109","paper":"brand-106"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Detalle de la ruta sanitaria adaptado del material del equipo. El estado reportado es paso 3. Composición, vida útil, envase y presentación de los ejemplos requieren confirmación. Requisitos, ensayos y costos se revisan al realizar el trámite. No atribuir aprobación del registro a estas gestiones.","appendix":true},{"id":"canvas","layout":"canvas","title":"El modelo de negocio\npropuesto","copy":"La oferta, los canales y la gestión se organizan alrededor de las ocasiones de compra.","chapter":"Apoyo","theme":"cream","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"Material de apoyo / Canvas","appe
