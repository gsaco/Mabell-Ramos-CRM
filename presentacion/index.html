</style></head><body><div id="root"></div><noscript>Activa JavaScript para recorrer la presentación interactiva de Mabell Ramos.</noscript><script>window.MABELL_DECK={"title":"Mabell Ramos · Asesoría y entregables","links":{"web":"https://gsaco.github.io/Mabell-Ramos/","productos":"https://gsaco.github.io/Mabell-Ramos/productos/","catering":"https://gsaco.github.io/Mabell-Ramos/catering/","app":"https://mabell-mi-dia.mabell-ramos-mi-dia.workers.dev/","whatsapp":"https://wa.me/51932666526?text=Hola%2C%20me%20gustar%C3%ADa%20consultar%20por%20alfajores%20cl%C3%A1sicos.%20%C2%BFQu%C3%A9%20presentaciones%20y%20cantidades%20tienen%20disponibles%3F","instagramReview":"https://www.instagram.com/p/DdzFxx-EXhM/c/18100571444382499/","excel":"https://raw.githubusercontent.com/gsaco/Mabell-Ramos/main/entregables/Control_Mabell_Ramos.xlsm"},"slides":[{"id":"oferta","chapter":"Inicio","theme":"cream","layout":"opening","title":"Mabell\nRamos","copy":"Organización comercial y gestión compartida para Mabell y Ana","label":"Asesoría a Mabell Ramos","images":["cover-web-current","cover-web-mobile-current"],"cta":"Explorar la página web","link":"web","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Presentar al equipo y a las emprendedoras. El propósito fue ordenar la oferta, coordinar pedidos y disponer de información para revisar costos y precios. El recorrido muestra lo desarrollado, cómo se trabajó con ambas y qué continúa después de la asesoría.","branding":{"paper":"brand-106","pattern":"brand-105","ornament":"brand-115"},"team":["Gabriel Andreas Saco Alvarado","Valentina Dahiana Paca Nuñez","Zahir Sebastian Melquiades Velasquez"],"logos":[{"asset":"logo","alt":"Logo original de Mabell Ramos"},{"asset":"logo-up","alt":"Universidad del Pacífico"}]},{"id":"punto-partida","layout":"baseline","title":"El punto de partida\nde la asesoría","copy":"Organizar la oferta y la atención para facilitar la compra y coordinar el trabajo de ambas.","chapter":"Inicio","theme":"lilac","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"01 / Punto de partida","rows":[["Oferta sin una prioridad visible","Siete productos seleccionados con ambas."],["Opciones que exigían aclaraciones","Seis paquetes según la ocasión de compra."],["Productos y catering poco diferenciados","Dos pestañas y canales de solicitud propios."],["Apuntes y cálculos separados","App compartida y Excel de control financiero."],["Seguimiento discontinuo de clientes","Historial, observaciones y comunicación coherente."]],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Secciones 6 a 9. Relacionar las cinco dificultades con los cinco objetivos. La oferta inicial era amplia y los acuerdos estaban dispersos. Estas condiciones exigían aclaraciones y dificultaban coordinar pedidos y eventos. No presentar como efecto medido una reducción de tiempos o un aumento de ventas."},{"id":"lineas","chapter":"Web","theme":"plum","layout":"lines","title":"Productos y catering,\ncon atención diferenciada","copy":"Una misma marca. Información y canales de solicitud adecuados para cada compra.","images":["live-web-chocotejas","live-web-catering"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE3. Productos se consulta por WhatsApp. Catering reúne los datos del evento en el formulario conectado al correo. Las emprendedoras validaron esa separación. La confirmación requiere revisar alcance, recursos y disponibilidad.","branding":{"paper":"brand-122","pattern":"brand-108","ornament":"brand-116"},"label":"02 / Oferta y atención"},{"id":"sabores","chapter":"Web","theme":"cream","layout":"collection","title":"Siete productos\nseleccionados con ellas","copy":"Identidad, buena acogida y facilidad de elaboración orientaron la selección con Mabell y Ana.","images":["live-web-chocotejas","live-web-alfajores"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1 y Anexo 3. Cuatro chocotejas: lúcuma, ají, frejol colado y manjar de pallar. Tres alfajores: clásico, cañihua y pistacho con arándano. Las preparaciones afroperuanas conviven con sabores complementarios. Los siete están en la web y predefinidos en la app. Se trabajaron referencias, composición, iluminación, fondos y acabados con edición y generación asistida. Son imágenes comerciales diseñadas, no fotografías documentales de una entrega.","branding":{"paper":"brand-120","pattern":"brand-109"},"label":"02 / Oferta y atención"},{"id":"paquetes","layout":"packages","title":"Seis opciones para\ntres ocasiones de compra","copy":"Dos paquetes por ocasión, acordados con las emprendedoras para orientar la atención.","chapter":"Web","theme":"cream","images":["alfajor-pistacho-arandano","chocoteja-lucuma","alfajor-clasico"],"branding":{"paper":"brand-106","pattern":"brand-109"},"groups":[{"title":"Regalo","intro":"Una caja con sabores a elección.","options":[["Pequeña","10 alfajores + 3 chocotejas"],["Grande","20 alfajores + 6 chocotejas"]]},{"title":"Descubrimiento","intro":"Los cuatro sabores de chocotejas.","options":[["Pequeño","4 chocotejas. Una de cada sabor."],["Grande","8 chocotejas. Dos de cada sabor."]]},{"title":"Consumo y recompra","intro":"Para compartir o repetir un favorito.","options":[["Paquete de 10","10 alfajores"],["Paquete de 30","30 alfajores"]]}],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE2 y Anexo 4. Las seis opciones están acordadas. Sabores y condiciones se precisan por WhatsApp. La web mantiene el foco en los siete productos. La app permite gestionar paquetes configurables. Las imágenes muestran productos, no representan el contenido exacto de una caja.","label":"02 / Oferta y atención"},{"id":"recorrido","chapter":"Web","theme":"lilac","layout":"funnel","title":"De las redes\na la consulta por WhatsApp","copy":"La web presenta una oferta acotada y prepara el primer contacto con el producto elegido.","images":["instagram-after","live-web-alfajores","live-whatsapp-landing"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Anexo 2. El contenido de TikTok e Instagram puede conducir a la web. Allí se conoce la historia y la oferta y se abre una consulta preparada en WhatsApp. La intención es facilitar la elección. El efecto sobre ventas se medirá en la campaña. El cliente decide si envía el mensaje. Consultar no crea automáticamente un pedido en la app.","branding":{"paper":"brand-121","pattern":"brand-107"},"label":"02 / Oferta y atención"},{"id":"catering","chapter":"Web","theme":"cream","layout":"catering","title":"La información del evento,\nlista para cotizar","copy":"El formulario reúne contacto, fecha, personas, distrito y alcance, y envía la solicitud al correo.","images":["live-web-catering-form","live-web-catering-mobile-top"],"cta":"Abrir catering","link":"catering","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE3 y sección 9. La recepción de una solicitud de prueba fue confirmada. Ambas revisaron los campos. La reserva se acuerda después de comprobar disponibilidad, recursos y precio. No mostrar la dirección de correo. El envío no se incorpora automáticamente a la app.","branding":{"paper":"brand-106","pattern":"brand-108"},"label":"02 / Oferta y atención"},{"id":"web-vivo","chapter":"Web","theme":"plum","layout":"trust","title":"La historia\ndetrás de la marca","copy":"Ana propuso que la web explicara quiénes están detrás del negocio. Adaptamos e integramos el video que nos compartieron.","images":["cover-web-current","live-web-contact"],"cta":"Ver historia en la web","link":"web","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1, OE5 y Anexo 2. El video fue proporcionado por las emprendedoras y adaptado e integrado por el equipo. No atribuir al equipo su filmación original. La web también enlaza reseñas a su comentario original en Instagram. No afirmar una mejora de conversión medida.","branding":{"paper":"brand-122","pattern":"brand-105"},"label":"02 / Oferta y atención"},{"id":"instagram-evolucion","chapter":"Web","theme":"plum","layout":"identity","title":"La misma identidad\nen cada contacto","copy":"Colores, tipografías, patrones e imágenes acordados con Mabell y Ana para redes, web y app.","images":["instagram-before","instagram-after","chocoteja-aji","live-app-alfajores","cover-web-current"],"label":"02 / Oferta y atención","branding":{"pattern":"brand-107"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE5 y sección 9. El antes y después muestra portadas de historias destacadas y nuevos carruseles. Se diseñaron imágenes comerciales y prepararon piezas audiovisuales y promocionales. El contenido quedó validado para activar la campaña. No atribuir variaciones de seguidores o ventas al rediseño."},{"id":"app","chapter":"App","theme":"lilac","layout":"appintro","title":"Mabell Ramos App:\ngestión compartida","copy":"Lo que una registra, la otra puede consultarlo. Ambas trabajan con la misma información.","images":["live-app-hoy","live-app-pedidos"],"cta":"Abrir la app","link":"app","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 5. Se evaluaron almacenamiento, sincronización, costo y capacidad. GitHub Pages se usa para la web. Cloudflare Workers y D1 sostienen los datos compartidos de la app. Se sincroniza con internet. Puede añadirse al inicio del celular. Sin conexión permite consultar lo descargado. La clave no se muestra en la presentación.","branding":{"paper":"brand-121","pattern":"brand-107"},"label":"03 / Gestión compartida"},{"id":"hoy","chapter":"App","theme":"cream","layout":"todayfocus","title":"Las entregas,\na primera vista","copy":"Hoy reúne las próximas entregas para que ambas puedan coordinar preparación, compras y horarios.","images":["live-app-hoy"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 5. Ampliar Próximas entregas y mostrar Nuevo pedido, Vendí algo y Anotar gasto. Son acciones revisadas con las emprendedoras. La captura muestra la interfaz, no resultados de ventas de la asesoría.","branding":{"paper":"brand-120","pattern":"brand-109"},"label":"03 / Gestión compartida"},{"id":"pedidos","chapter":"App","theme":"cream","layout":"orders","title":"Cada pedido,\ncon sus acuerdos","copy":"Cliente, teléfono, cantidades, entrega, adelanto y saldo quedan asociados al mismo pedido.","images":["live-app-new-order","live-app-detail"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4, OE5 y Anexo 5. Las notas conservan preferencias y acuerdos. La búsqueda y Repetir pedido ayudan a retomar clientes, revisando precios y condiciones vigentes. Las capturas de detalle y edición usan datos de demostración, sin contacto personal.","branding":{"paper":"brand-124","pattern":"brand-108"},"galleries":[{"label":"Registrar","screens":[["Pedido","live-app-new-order"],["Entrega","live-app-order-contact"]]},{"label":"Dar seguimiento","screens":[["Detalle","live-app-detail"],["Editar","live-app-edit-order"],["Lista","live-app-pedidos"]]}],"label":"03 / Gestión compartida"},{"id":"dinero","chapter":"App","theme":"plum","layout":"money","title":"Registrar en la feria\ny revisar después","copy":"Vendí algo guarda la venta y su cobro. Anotar gasto registra el desembolso. Dinero reúne cobros, gastos y saldos.","images":["live-app-dinero","live-app-expense"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4, Anexo 5 y sección 11.5. Al terminar una feria se contrastan registros y medios de pago. Cobros y gastos son movimientos de dinero. La utilidad requiere completar costos y producción en el Excel. Las capturas no muestran indicadores reales de la intervención.","branding":{"pattern":"brand-107"},"galleries":[{"label":"El panorama","screens":[["Resumen","live-app-dinero"],["Movimientos","live-app-movimientos"]]},{"label":"Los registros","screens":[["Gasto","live-app-expense"],["Excel","live-app-excel"]]}],"label":"03 / Gestión compartida"},{"id":"autonomia","chapter":"App","theme":"lilac","layout":"autonomy","title":"Una app flexible\npara su negocio","copy":"Pueden añadir productos, cambiar precios y subir fotos desde el celular, conservando los pedidos anteriores.","images":["live-app-alfajores","live-app-help"],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE1 y OE4. Mostrar primero Editar producto. Pueden cambiar nombre, presentación, precio y foto, pausar referencias y gestionar paquetes. La app se añade al inicio del celular. La edición del catálogo no actualiza automáticamente la web. Los cambios fuera de los campos editables pueden requerir apoyo técnico.","branding":{"paper":"brand-106","pattern":"brand-105"},"galleries":[{"label":"Su colección","screens":[["Editar","live-app-edit-product"],["Productos","live-app-alfajores"]]},{"label":"Su negocio","screens":[["Ayuda","live-app-help"],["Ajustes","live-app-business"],["Conexión","live-app-health"]]}],"label":"03 / Gestión compartida"},{"id":"excel","chapter":"Excel","theme":"cream","layout":"excel","title":"Cinco hojas para\nconservar lo registrado","copy":"Pedidos, clientes, productos, pagos y gastos quedan organizados en un archivo que pueden descargar.","label":"04 / Control financiero","images":["live-app-excel"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Anexo 5. Cinco hojas: Resumen, Pedidos, Detalle, Movimientos y Productos. La tabla contiene datos ficticios. Seguir Cliente 02: seis alfajores, venta S/30, cobrado S/15 y saldo S/15. El mismo caso continúa en la siguiente diapositiva. Cada descarga refleja lo disponible en ese momento. No incluye fotos. Los cambios de Excel no regresan a la app."},{"id":"control-puente","chapter":"Excel","theme":"plum","layout":"financebridge","title":"Del registro diario\nal análisis de costos","copy":"El historial permite revisar las ventas y trasladarlas al control financiero, completando producción y costos.","label":"04 / Control financiero","images":["live-app-excel"],"branding":{"pattern":"brand-107"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. OE4 y Anexo 6. Continuar el caso ficticio Cliente 02: seis alfajores, venta S/30, cobrado S/15, saldo S/15. Revisar cantidades y precios y completar canal, producción y costos. El traslado es manual, sin sincronización automática. Los adelantos no se suman como ventas adicionales. Los costos de ejemplo se actualizarán con datos reales."},{"id":"control-costos","chapter":"Excel","theme":"cream","layout":"financecosts","title":"Conocer los costos\npara revisar los precios","copy":"El costo por tanda y los gastos fijos permiten evaluar cuánto aporta cada producto y qué precio puede sostenerlo.","label":"04 / Control financiero","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Abrir primero Costos_Fijos y después Costos_Tanda y Precios. Recorrer las tres pestañas. Costos_Tanda suma los conceptos por producto y divide el total entre las unidades de la tanda, actualmente 60. Los dos productos y sus importes son ejemplos del archivo, no costos reales validados. El costo del alfajor suma S/ 56.50 y el de la chocoteja S/ 60.93. Costos_Fijos reúne gastos mensuales, cuyos importes todavía están vacíos; la vista agrupa algunos conceptos para facilitar la lectura. Precios toma el costo unitario, permite ingresar el precio de venta y calcula la diferencia, su porcentaje sobre el precio y un precio sugerido con margen objetivo. Usamos el término aporte por unidad porque todavía falta cubrir los costos fijos. Las cifras visibles se redondean, pero el cálculo usa la precisión completa del archivo. Las tablas son representaciones simplificadas, no capturas de Microsoft Excel. El catálogo de productos y conceptos se puede adaptar."},{"id":"control-resultados","chapter":"Excel","theme":"lilac","layout":"financeresults","title":"Una referencia clara\nde cuánto vender","copy":"El punto de equilibrio relaciona los costos fijos con el aporte de las ventas. Los registros permiten revisar el avance.","label":"04 / Control financiero","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-105"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Abrir primero Punto_Equilibrio y después Ventas_Canales. Recorrer Ventas_Canales y Punto_Equilibrio. El archivo permite registrar fecha, canal (Catering, Feria o Pedido), producto, unidades producidas y vendidas. Calcula ingresos, costo producido y sobrantes; el resumen por canal es acumulado, no está filtrado por mes. Punto_Equilibrio calcula metas por producto y un promedio suponiendo que todos los productos se venden por igual. Permite añadir ganancia deseada, muestra una referencia semanal dividiendo entre 4.3 y selecciona el mes para medir el avance. El resultado mensual es ingresos menos costo de toda la producción del mes menos costos fijos, según la fórmula del archivo; no es un estado de resultados contable completo ni equivale al efectivo cobrado. Ejemplo ilustrativo: 120 alfajores producidos, 110 vendidos a S/ 2.50 por Catering; 60 chocotejas producidas y 50 vendidas a S/ 3 por Feria; otras 60 producidas y vendidas por Pedido. Todos los registros del ejemplo corresponden al mismo mes. Ingresos S/ 605; costo producido S/ 234.86; sobrantes 20 unidades. Con S/ 300 de costos fijos, ganancia objetivo cero y mezcla de ventas 50/50, la meta es 170 unidades o S/ 467.50. El avance es 129.4% y el resultado mensual S/ 70.14. Estos datos ilustran las fórmulas del archivo; no son cifras reales del negocio. Para usar sus botones, abrir el .xlsm en Excel de escritorio con las macros autorizadas."},{"id":"san-ruta","chapter":"Registro","theme":"lilac","layout":"sanroute","title":"Registro sanitario:\nel avance de la asesoría","copy":"Trabajamos la ruta para la chocoteja de lúcuma, con ficha técnica, rotulado y avance en análisis de laboratorio.","steps":[["RUC y Clave SOL","Preparar el acceso a la VUCE."],["Ficha técnica","Composición, lote, envase y rotulado."],["Análisis en laboratorio","Cotizar y realizar los ensayos del producto."],["Solicitud en VUCE","Reunir el informe y la documentación."],["Costos y observaciones","Verificar la tasa vigente y responder observaciones."],["Registro y etiqueta","Incorporar el código y controlar su vigencia."]],"label":"05 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-105","paper":"brand-106"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Secciones 8.4 y 9. El avance reportado está en el paso 3 de seis. Se preparó documentación y se avanzó en laboratorio. No se presenta el registro como obtenido. Receta, vida útil, presentación y documentos deben confirmarse. El apoyo conserva detalle de los tres primeros pasos."},{"id":"san-siguientes","chapter":"Registro","theme":"plum","layout":"sannext","title":"Los pasos que continúan\ndespués del laboratorio","copy":"Reunir resultados, preparar la solicitud y atender las observaciones hasta completar el trámite.","steps":[["Presentar la solicitud","Ingresar a la VUCE y seleccionar el trámite de Registro Sanitario de Alimentos de DIGESA.","Reunir el informe del laboratorio, la ficha y el proyecto de rotulado."],["Atender observaciones","Confirmar la tasa en el TUPA vigente y revisar las comunicaciones del trámite.","Responder las observaciones dentro del plazo indicado."],["Recibir el registro","Incorporar el código en la etiqueta definitiva y guardar la documentación.","Anotar la fecha de vencimiento y preparar la reinscripción cuando corresponda."]],"label":"05 / Registro sanitario","images":["logo"],"branding":{"pattern":"brand-107"},"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Plan de continuidad. Son acciones pendientes. Las tasas y requisitos se revisan al tramitar. No prometer una fecha de aprobación ni acceso automático a nuevos canales."},{"id":"acompanamiento","layout":"training","title":"Diseñar con ellas\ny aprender con el uso","copy":"Las propuestas se ajustaron con sus comentarios. La capacitación continuó con ejemplos, casos y práctica recurrente.","chapter":"Cierre","theme":"cream","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"06 / Acompañamiento","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Sección 8.4 y lecciones. Mabell orientó sabores y regalos. Ana destacó el video y orientó la web y app. Zahir capacitó reiteradamente a Mabell en Excel y Gabriel acompañó a Ana en las herramientas digitales. Valentina coordinó el OE5. Ambas registraron operaciones y señalaron utilidad. Se atendieron consultas y se reforzó la práctica porque Mabell explicó que podía olvidar una primera explicación. No inventar un número de sesiones ni afirmar autonomía sostenida medida."},{"id":"resultados","layout":"outcomes","title":"Qué dejó\nla asesoría","copy":"Entregables operativos, revisados y utilizados con Mabell y Ana.","chapter":"Cierre","theme":"plum","images":["logo"],"branding":{"pattern":"brand-107"},"label":"06 / Resultados","rows":[["Oferta amplia y poco priorizada","7 productos definidos en la web y la app."],["Opciones que exigían aclaraciones","6 paquetes acordados para tres ocasiones."],["Productos y catering poco diferenciados","2 líneas con canales propios. Formulario probado."],["Registros separados","App compartida y exportación de 5 hojas comprobada."],["Cálculos y seguimiento dispersos","Excel de control, historial y contenidos validados."]],"notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Sección 9. Las cantidades son entregables, no cifras de ventas. Se confirmó recepción del formulario, sincronización y exportación. Aporte económico cualitativo: información ordenada para revisar costos y precios. Ventas, tiempos de atención y autonomía sostenida se medirán durante la continuidad."},{"id":"continuidad","layout":"future","title":"Los próximos\nseis meses","copy":"Del 15 de noviembre de 2026 al 14 de mayo de 2027. Ana coordina atención y contenidos. Mabell, producto y capacidad. Ambas registran.","chapter":"Cierre","theme":"lilac","images":["logo"],"branding":{"paper":"brand-106","pattern":"brand-109"},"label":"06 / Continuidad y aprendizaje","notes":"Fuente: Informe final Mabell Ramos, versión del 14 de noviembre de 2026. Sección 11. M1: dos piezas y piloto de siete días, prueba del recorrido y seguimiento de clientes. M1–M2: costos reales de siete productos. Cada mes: revisión de pedidos, cobros, producción y equilibrio, con traslado manual al Excel. Practicar para consolidar autonomía y continuar la ruta sanitaria. Son metas propuestas. La continuidad requiere práctica recurrente y ajustes según el uso."},{"id":"san-acceso","chapter":"Apoyo","theme":"cream","layout":"sandetail","title":"Primero,\nel acceso al trámite","copy":"Paso 1 · RUC y Clave SOL","actions":["Confirmar que el RUC de Ana esté activo como persona natural con negocio.","Actualizar correo y celular de la ficha RUC.","Generar o recuperar la Clave SOL.","Probar el ingreso a la VUCE y elegir DIGESA."],"note":"Este paso se cierra al comprobar que Ana puede ingresar a la VUCE.","documentLabel":"ACCESO AL TRÁMITE","documentTitle":"Ana Joya · Titular","fields":[["RUC","Persona natural con negocio. Según el material, Ana ya cuenta con él."],["Ficha RUC","Correo y celular actualizados para gestionar el acceso."],["Clave SOL","Generación o recuperación desde los canales de SUNAT."],["VUCE","Ingreso con RUC, usuario y Clave SOL. Entidad: DIGESA."]],"label":"Material de apoyo / Registro sanitario","images":["logo"],"branding":{"pattern":"br
