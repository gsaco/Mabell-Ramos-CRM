name: Publicar presentación Mabell Ramos
on:
  push:
    branches: [main]
    paths:
      - 'presentacion/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la presentación
        run: |
          test -s presentacion/index.html
          test -d presentacion/assets
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('presentacion')
          html=(root/'index.html').read_text()
          for asset in set(re.findall(r'\./assets/[A-Za-z0-9_.-]+', html)):
              assert (root/asset).is_file(), asset
          assert 'window.MABELL_ASSETS' in html
          assert 'window.MABELL_DECK' in html
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentacion
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar presentación
        id: deployment
        uses: actions/deploy-pages@v4
